# MAW-KG 仓库注册表（2026-10-07 #3：REPO_ROOTS 从 mcp_server.py 源码外置）
#
# 加仓方法：在下方 repos 块追加一行 `名称: 绝对路径`，然后重启 MCP 进程即可，
# 无需再改 mcp_server.py 源码。键 = MCP 工具里传的 repo 参数名。
#
# 索引纪律（v3.1 §5.1）：
#   - 可写索引（daemon/wal/shm 有 churn）必须落在 4KB 簇的 NTFS（C:/D:），
#     禁止落在 >64KB 簇的卷（如 E 盘 exFAT）——只读单文件查询索引可容忍大簇。
#   - 新建索引：在仓库目录跑 `codegraph init -v`（不是 `index`）。
#
repos:
  ha-core: E:/CrossDevice_Agent_GitNexus_Pilot/repos/home-assistant-core
  ha-android: E:/CrossDevice_Agent_GitNexus_Pilot/repos/home-assistant-android
  ha-ios: E:/CrossDevice_Agent_GitNexus_Pilot/repos/home-assistant-ios
  homogram-arkts: E:/CrossDevice_Agent_GitNexus_Pilot/repos/homogram-arkts
  aaos-codelabs: E:/CrossDevice_Agent_GitNexus_Pilot/repos/aaos-car-codelabs
  ekko-studio: E:/CrossDevice_Agent_GitNexus_Pilot/repos/ekko-studio
  hermes-agent: C:/Users/pc/AppData/Local/hermes/hermes-agent
